name: Build APK

# Builds an installable APK on every push to main, or when you press "Run workflow".
# No secrets or keys needed. The APK is attached to a GitHub Release so you can
# download it straight on your phone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle itself, so no gradlew file is needed
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Tests are informational: a failing test will not stop the APK being built
      - name: Unit tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SmsSpend-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmsSpend-apk
          path: SmsSpend-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SMS Spend build ${{ github.run_number }}
          files: SmsSpend-${{ github.run_number }}.apk
          make_latest: true
